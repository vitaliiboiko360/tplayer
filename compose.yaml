services:
  web:
    image: nginx:latest
    container_name: nginx_web_test
    network_mode: 'host'
    volumes:
      - ../webtest:/var/www/web
      - ./nginx.conf:/etc/nginx/nginx.conf
    ports:
      - '8081:8081'
    environment:
      - NGINX_HOST=language-shadowing-learn.com
      - NGINX_PORT=8081
