<!doctype html>
<html>
  <head>
    <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta name="description" content="A new Flutter project." />

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="tplayer" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <title>tplayer</title>
    <link rel="manifest" href="manifest.json" />
  </head>
  <body>
    <script src="flutter_bootstrap.js" async></script>
    <script>
      window.addEventListener('load', function () {
        // Target the canvas elements Flutter generates
        const observer = new MutationObserver(function (mutations) {
          mutations.forEach(function (mutation) {
            mutation.addedNodes.forEach(function (node) {
              if (
                node.tagName === 'CANVAS' ||
                (node.shadowRoot && node.shadowRoot.querySelector('canvas'))
              ) {
                const canvas =
                  node.tagName === 'CANVAS'
                    ? node
                    : node.shadowRoot.querySelector('canvas');

                if (canvas) {
                  canvas.addEventListener(
                    'webglcontextlost',
                    function (event) {
                      // Prevent the browser from permanently disabling WebGL on this canvas
                      event.preventDefault();
                      console.warn(
                        'Flutter WebGL context lost. Force-reloading page to recover state...',
                      );

                      // Triggers an app refresh to instantly rebuild the CanvasKit layer
                      window.location.reload();
                    },
                    false,
                  );
                }
              }
            });
          });
        });

        observer.observe(document.body, { childList: true, subtree: true });
      });
    </script>
  </body>
</html>
